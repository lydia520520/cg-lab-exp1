<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Work8 Linear Blend Skinning - Xu Yijia</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app">
      <header class="toolbar">
        <div class="identity">
          <span class="course">BNU Computer Graphics</span>
          <h1>Work8 Linear Blend Skinning</h1>
          <span class="author">Author: Xu Yijia</span>
        </div>
        <div class="actions" aria-label="animation controls">
          <button id="toggleAnim" type="button">Animate</button>
          <button id="resetPose" type="button">Reset</button>
        </div>
      </header>

      <section class="workspace">
        <canvas id="skinCanvas" width="980" height="620" aria-label="linear blend skinning demo"></canvas>
        <aside class="panel">
          <label>
            Shoulder
            <input id="shoulder" type="range" min="-95" max="95" value="-12" step="1">
          </label>
          <label>
            Elbow
            <input id="elbow" type="range" min="-135" max="135" value="46" step="1">
          </label>
          <label>
            Wrist
            <input id="wrist" type="range" min="-110" max="110" value="-34" step="1">
          </label>
          <label>
            Blend Radius
            <input id="blendRadius" type="range" min="4" max="52" value="28" step="1">
          </label>
          <label class="check">
            <input id="showWeights" type="checkbox" checked>
            Show weights
          </label>
          <label class="check">
            <input id="showBind" type="checkbox" checked>
            Show bind pose
          </label>
          <div class="stats" aria-live="polite">
            <span id="vertexCount">Vertices 0</span>
            <span id="jointCount">Joints 0</span>
          </div>
        </aside>
      </section>
    </main>

    <script src="./src/lbs.js"></script>
    <script src="./src/demo.js"></script>
  </body>
</html>
